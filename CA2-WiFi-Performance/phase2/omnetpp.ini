# CA2 phase 2: the performance anomaly and airtime fairness.
#
# Your group's parameters (n, the slow and fast bitrates, L) come from
# ../params.ini, written by ca2_params.py. Station host[0] is the slow one.
#
# C++: the project must be built (Project > Build Project) before running.

[General]
network = Anomaly
include ../params.ini
sim-time-limit = 12s
warmup-period = 2s
**.vector-recording = false

**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxX = 400m
**.constraintAreaMaxY = 400m
**.constraintAreaMaxZ = 0m
*.ap.mobility.initialX = 200m
*.ap.mobility.initialY = 200m
**.mobility.initialZ = 0m
**.mobility.initFromDisplayString = false

*.radioMedium.sameTransmissionStartTimeCheck = "ignore"
**.wlan[*].opMode = "a"
**.wlan[*].radio.bandName = "5 GHz (20 MHz)"
**.wlan[*].radio.channelNumber = 8
**.wlan[*].radio.transmitter.power = 20mW
**.fragmentationPolicy.fragmentationThreshold = 2346B

# no scanning or association: every station is attached to the AP from t = 0
*.ap.wlan[*].mgmt.typename = "Ieee80211MgmtApSimplified"
*.ap.wlan[*].address = "10:00:00:00:00:00"
*.host[*].wlan[*].mgmt.typename = "Ieee80211MgmtStaSimplified"
*.host[*].wlan[*].mgmt.accessPointAddress = "10:00:00:00:00:00"
*.host[*].wlan[*].agent.typename = ""
**.arp.typename = "GlobalArp"

# the AP sends to each station at that station's own bitrate
*.ap.wlan[*].mac.dcf.typename = "phase2.RateTableDcf"

# UDP traffic: Poisson arrivals, far more than the channel can carry (saturation)
**.app[*].sendInterval = exponential(50us)

[Config Uplink]
description = "every station sends to the server"
*.host[*].numApps = 1
*.host[*].app[0].typename = "UdpBasicApp"
*.host[*].app[0].destAddresses = "server"
*.host[*].app[0].destPort = 5000 + ancestorIndex(1)
*.server.numApps = parent.n
*.server.app[*].typename = "UdpSink"
*.server.app[*].localPort = 5000 + ancestorIndex(0)

[Config DownlinkFifo]
description = "the server sends to every station; the AP has one FIFO queue"
*.server.numApps = parent.n
*.server.app[*].typename = "UdpBasicApp"
*.server.app[*].destAddresses = "host[" + string(ancestorIndex(0)) + "]"
*.server.app[*].destPort = 5000
*.host[*].numApps = 1
*.host[*].app[0].typename = "UdpSink"
*.host[*].app[0].localPort = 5000

[Config DownlinkAirtime]
description = "as DownlinkFifo, but the AP has one queue per station and your scheduler"
extends = DownlinkFifo
*.ap.wlan[*].mac.dcf.channelAccess.pendingQueue.typename = "phase2.AirtimeFairQueue"

