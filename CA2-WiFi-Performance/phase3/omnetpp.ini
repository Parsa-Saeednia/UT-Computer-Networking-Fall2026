# CA2 phase 3: roaming between two APs, and the sticky client.
#
# Your group's parameters (path-loss exponent and shadowing, walking speed,
# beacon interval, scanned channels, AP spacing D) come from ../params.ini,
# written by ca2_params.py. The walk is the turtle script in that file:
# the walker starts 2 m beside ap1, walks D metres towards ap2 and then
# stands still. Every config runs long enough for the slowest walk.
#
# The scan config (ScanNeighbor)
# is yours to write; add it at the end.

[General]
network = Roaming
include ../params.ini
sim-time-limit = 120s
**.vector-recording = false

**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxX = 600m
**.constraintAreaMaxY = 200m
**.constraintAreaMaxZ = 0m
**.mobility.initialZ = 0m
**.mobility.initFromDisplayString = false

# log-distance path loss with log-normal shadowing: a fresh N(0, sigma) dB draw for every frame
*.radioMedium.pathLoss.typename = "LogNormalShadowing"
*.radioMedium.sameTransmissionStartTimeCheck = "ignore"
# 20 MHz channels 20 MHz apart only touch at the edges; they do not interfere
*.radioMedium.analogModel.ignorePartialInterference = true

# 802.11a; INET channel k is centred at 5010 + 20 k MHz
**.opMode = "a"
**.radio.bandName = "5 GHz (20 MHz)"
**.radio.transmitter.power = 20mW
**.wlan*.bitrate = 12Mbps
# beacons, probes and other management frames at the lowest rate, as real APs do
**.rateSelection.mgmtFrameBitrate = 6Mbps
**.rateSelection.multicastFrameBitrate = 6Mbps

# two APs of the same network (same SSID) on channels 1 and 3
*.ap1.wlan.address = "10:00:00:00:00:01"
*.ap2.wlan.address = "10:00:00:00:00:02"
*.ap*.wlan.mgmt.ssid = "CA2"
*.ap1.wlan.radio.channelNumber = 1
*.ap2.wlan.radio.channelNumber = 3

# voice-like stream: 160 B every 20 ms, to whichever AP the station is associated with
*.host.cli.destAddress = "20:00:00:00:00:00"
*.host.cli.sendInterval = 20ms
*.host.cli.reqLength = 160B
*.host.cli.respLength = 0B
*.host.cli.startTime = 1s

[Config Walk]
description = "the station walks from ap1 to ap2; INET's own roaming decision"
repeat = 5
# frames delivered by each AP, one sample per frame
*.ap*.sink.packets.result-recording-modes = +vector(packetLength)
*.ap*.sink.packets:vector(packetLength).vector-recording = true
# what the station does: management requests and confirms, the channel it listens on, SNIR of each frame it receives
*.host.wlan.agent.*:vector.vector-recording = true
*.host.wlan.radio.radioChannel:vector.vector-recording = true
*.host.wlan.radio.minSnir.result-recording-modes = +vector
*.host.wlan.radio.minSnir:vector.vector-recording = true
# first transmissions and retransmissions of the station's data frames
*.host.wlan.mac.dcf.packetSentToPeerWith*Retry:vector(packetBytes).vector-recording = true

[Config Survey]
description = "a receive-only meter walks the same path and records every beacon of both APs"
repeat = 3
*.survey = true
*.meter.wlan[0].radio.channelNumber = 1
*.meter.wlan[1].radio.channelNumber = 3
# Ieee80211MgmtStaSimplified needs an AP address; the meter never sends anything to it
*.meter.wlan[0].mgmt.accessPointAddress = "10:00:00:00:00:01"
*.meter.wlan[1].mgmt.accessPointAddress = "10:00:00:00:00:02"
*.meter.wlan[*].radio.minSnir.result-recording-modes = +vector
*.meter.wlan[*].radio.minSnir:vector.vector-recording = true

