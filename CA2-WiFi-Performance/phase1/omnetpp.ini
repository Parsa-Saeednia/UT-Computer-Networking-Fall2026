# CA2 phase 1: DCF contention and the slotted contention model.
#
# Your group's payload L and bitrate R come from ../params.ini, which
# ca2_params.py writes. Run it once before the first simulation:
#     python3 ca2_params.py <student-id> <student-id>
# Do not set L or R anywhere else.
#
# The parameter-study config (Sweep) is yours to write;
# add it at the end of this file.

[General]
network = Contention
include ../params.ini
sim-time-limit = 12s
warmup-period = 2s
**.vector-recording = false

**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxX = 400m
**.constraintAreaMaxY = 400m
**.constraintAreaMaxZ = 0m

# two stations may end their backoff in the same slot: that is a collision, not an error
*.radioMedium.sameTransmissionStartTimeCheck = "ignore"

# 802.11a at 5.17 GHz (INET channel numbering: 5010 + 20 * 8 MHz)
**.wlan*.opMode = "a"
**.wlan*.radio.bandName = "5 GHz (20 MHz)"
**.wlan*.radio.channelNumber = 8
**.radio.transmitter.power = 20mW

# no fragmentation: INET's default threshold (1500 B) would split frames with L + 31 > 1500
**.fragmentationPolicy.fragmentationThreshold = 2346B

**.ap.wlan.address = "10:00:00:00:00:00"
**.mgmt.accessPointAddress = "10:00:00:00:00:00"

# saturated senders: a new frame every 50 us, so the MAC queue never empties
**.cli.respLength = 0B
**.cli.destAddress = "20:00:00:00:00:00"
**.cli.sendInterval = 50us

# the AP sits at (200 m, 200 m); stations are placed on a circle around it (Contention.ned)
*.ap.mobility.initialX = 200m
*.ap.mobility.initialY = 200m
**.mobility.initialZ = 0m
**.mobility.initFromDisplayString = false

[Config Timing]
description = "one station; records an eventlog for the Sequence Chart"
sim-time-limit = 20ms
warmup-period = 0s
*.n = 1
record-eventlog = true

[Config CwTrace]
description = "ten stations; records the contention window of host[0]"
*.n = 10
*.host[0].wlan.mac.dcf.recoveryProcedure.contentionWindowChanged:vector.vector-recording = true

[Config Hidden]
description = "two stations hidden from each other, without and with RTS/CTS"
repeat = 5
*.n = 2
*.r = 100m
# each station hears the AP but not the other station
*.host[*].wlan.radio.receiver.energyDetection = -77dBm
*.host[*].wlan.radio.receiver.sensitivity = -77dBm
**.wlan*.mac.dcf.rtsPolicy.rtsThreshold = ${rtsThreshold=3000B, 100B}

[Config HiddenTrace]
description = "as Hidden, but 50 ms with an eventlog: for the Sequence Chart screenshots"
extends = Hidden
repeat = 1
sim-time-limit = 50ms
warmup-period = 0s
record-eventlog = true

